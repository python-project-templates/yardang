name: Docs
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
permissions:
    contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions-ext/python/setup@a3f3953ef26a519ab7b6a56b94d06fa1b31ab3f3
      with:
        version: '3.11'

    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: '22'

    - name: Setup Rust
      uses: actions-ext/rust/setup@3de300f3071e758a1dd8545b884288a35e5d7f81

    - name: Install JSDoc/TypeDoc
      run: npm install -g jsdoc typedoc

    - name: Install doxygen
      run: sudo apt-get install -y doxygen

    # Build with the working copy (not the released yardang) so that the docs,
    # and the per-theme previews below, exercise the version in this repo.
    - name: Install self
      run: pip install -e .[develop]

    - name: Build docs
      run: yardang build

    # Render the full site once per bundled theme into docs/html/_previews/<theme>/
    # so each theme is browsable live at a suburl of the published site.
    - name: Build theme previews
      run: yardang preview

    - name: Publish to GitHub Pages
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: docs/html
        force_orphan: true

    - name: Build Wiki
      run: yardang wiki --output-dir docs/wiki

    - name: Upload Documentation to Wiki
      uses: Andrew-Chen-Wang/github-wiki-action@v5
      with:
        path: docs/wiki
